# JVM memory settings for Gradle & Kotlin
org.gradle.jvmargs=-Xmx3072M -XX:MaxMetaspaceSize=768M -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true

# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Fix for Kotlin compile daemon failure on Windows (socket / memory timeout)
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.jvmargs=-Xmx2048M -XX:MaxMetaspaceSize=512M
