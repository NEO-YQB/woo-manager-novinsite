name: Build & Release App and WordPress Plugin

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK & Package Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Flutter Project & Analyze
        run: flutter analyze --no-fatal-infos || true

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Package WordPress Companion Plugin
        run: |
          mkdir -p releases
          cp build/app/outputs/flutter-apk/app-release.apk releases/app-release.apk
          cd wordpress-plugin
          zip -r ../releases/woo-mobile-connector.zip woo-mobile-connector
          cd ..

      - name: Upload APK & Plugin Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: novinsite-store-manager-release
          path: |
            releases/app-release.apk
            releases/woo-mobile-connector.zip

      - name: Create GitHub Release (On Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            releases/app-release.apk
            releases/woo-mobile-connector.zip
          title: "NovinSite Store Manager ${{ github.ref_name }}"
          body: |
            ## 🚀 NovinSite Store Manager Release ${{ github.ref_name }}
            
            ### 📱 Android Application:
            - **Download:** `app-release.apk`
            - Compatible with Android 8.0+ (API 26+)
            
            ### 🔌 WordPress Companion Plugin:
            - **Download:** `woo-mobile-connector.zip`
            - Upload via WP Admin: `Plugins > Add New > Upload Plugin`
            
            Built with 💚 by [NovinSite](https://novinsite.com)
          draft: false
          prerelease: false
